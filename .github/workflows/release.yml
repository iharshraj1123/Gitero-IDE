name: Release & Publish Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.4.0-beta)'
        required: true
        default: 'v0.4.0-beta'

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Inno Setup
        run: choco install innosetup -y

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Bundle
        run: npm run build

      - name: Package Neutralino Resources
        run: npm run neu:build

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer/gitero.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: |
            dist/gitero/resources.neu
            installer-output/*.exe
          generate_release_notes: true
