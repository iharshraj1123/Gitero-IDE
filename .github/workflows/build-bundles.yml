name: Build & Publish Release Bundles

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Compile and Bundle Gitero IDE
        run: npm run build

      - name: Archive Production Bundle
        run: |
          cd dist
          zip -r ../dist-bundle.zip .
          cd ..

      - name: Upload Branch Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitero-bundle-${{ github.ref_name }}
          path: dist-bundle.zip
          retention-days: 30

      - name: Generate Neutralino resources.neu
        run: npx @neutralinojs/neu build

      - name: Publish Continuous Rolling Branch Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload continuous-${{ github.ref_name }} dist/gitero/resources.neu --clobber || \
          gh release create continuous-${{ github.ref_name }} dist/gitero/resources.neu --title "Continuous Branch Build (${{ github.ref_name }})" --notes "Automated rolling build of resources.neu for branch ${{ github.ref_name }}" --prerelease
