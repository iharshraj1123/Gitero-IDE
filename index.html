<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gitero IDE</title>
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body>
  <div id="app">
    <div class="ide-workspace">
      <!-- Left Activity Bar -->
      <aside class="activity-bar">
        <div class="activity-group">
          <button class="activity-btn active" id="btn-act-explorer" title="Explorer (Ctrl+Shift+E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
          </button>
          <button class="activity-btn" id="btn-act-search" title="Search (Ctrl+Shift+F)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="activity-btn" id="btn-act-git" title="Source Control (Ctrl+Shift+G)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
          </button>
        </div>
        <div class="activity-group">
          <button class="activity-btn" id="btn-act-theme" title="Color Themes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
          </button>
          <button class="activity-btn" id="btn-act-settings" title="Settings & Custom CSS">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </aside>

      <!-- Sidebar (File Explorer) -->
      <section class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span id="workspace-title">EXPLORER</span>
          <div class="sidebar-actions">
            <button class="sidebar-action-btn" id="btn-new-file" title="New File">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M12 9v6"/><path d="M9 12h6"/></svg>
            </button>
            <button class="sidebar-action-btn" id="btn-new-folder" title="New Folder">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>
            </button>
            <button class="sidebar-action-btn" id="btn-refresh" title="Refresh Explorer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
            </button>
          </div>
        </div>

        <div class="sidebar-workspace-btn-container">
          <button class="btn-open-folder" id="btn-open-folder">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
            Open Folder
          </button>
        </div>

        <div class="sidebar-content" id="file-tree-container"></div>
      </section>

      <!-- Main Editor Container -->
      <main class="editor-main">
        <!-- Top Tab Bar -->
        <div class="tab-bar-container" id="tab-bar"></div>

        <!-- Breadcrumbs Navigation -->
        <div class="breadcrumbs-bar" id="breadcrumbs-bar">
          <span class="breadcrumb-part" id="breadcrumb-text">Gitero IDE</span>
        </div>

        <!-- CodeMirror Editor Viewport -->
        <div class="editor-viewport" id="editor-viewport">
          <div class="editor-empty-state" id="empty-state">
            <div class="empty-logo">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            </div>
            <h2>Gitero IDE</h2>
            <div class="empty-shortcuts">
              <div class="shortcut-row"><span>Quick Open File</span><span class="shortcut-key">Ctrl + P</span></div>
              <div class="shortcut-row"><span>Command Palette</span><span class="shortcut-key">Ctrl + Shift + P</span></div>
              <div class="shortcut-row"><span>Save Active File</span><span class="shortcut-key">Ctrl + S / :w</span></div>
              <div class="shortcut-row"><span>Toggle Sidebar</span><span class="shortcut-key">Ctrl + B</span></div>
              <div class="shortcut-row"><span>Open Settings</span><span class="shortcut-key">Ctrl + ,</span></div>
            </div>
          </div>
          <div id="codemirror-root" style="height: 100%; display: none;"></div>
        </div>
      </main>
    </div>

    <!-- Bottom Status Bar -->
    <footer class="status-bar" id="status-bar"></footer>
  </div>

  <script src="/js/neutralino.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
